name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libglfw3-dev libgl-dev xvfb
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j4
      - name: Self-test
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./build/CivVIReplay --selftest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-linux
          path: ~/.config/civvireplay/selftest.png
          if-no-files-found: ignore

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure (universal binary)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
      - name: Build
        run: cmake --build build -j3
      - name: Ad-hoc sign
        run: codesign --force --sign - build/CivVIReplay.app
      - name: Check bundle
        run: |
          plutil -lint build/CivVIReplay.app/Contents/Info.plist
          test -f build/CivVIReplay.app/Contents/Resources/font/ProggyTiny.ttf
          test -f build/CivVIReplay.app/Contents/Resources/CivVIReplay.icns
          lipo -info build/CivVIReplay.app/Contents/MacOS/CivVIReplay
          codesign --verify --verbose build/CivVIReplay.app
      # The virtual macOS runners have no OpenGL pixel formats ("NSGL: Failed to find a suitable
      # pixel format"), so the window part of the self-test can only run on a real Mac.
      - name: Self-test (no window on the runner)
        run: build/CivVIReplay.app/Contents/MacOS/CivVIReplay --selftest --headless
      - name: Package
        run: ditto -c -k --keepParent build/CivVIReplay.app CivVIReplay-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CivVIReplay-macOS
          path: CivVIReplay-macOS.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release -j
      - name: Self-test (no window on the runner)
        run: build\Release\CivVIReplay.exe --selftest --headless
      - uses: actions/upload-artifact@v4
        with:
          name: CivVIReplay-Windows
          path: build/Release/
